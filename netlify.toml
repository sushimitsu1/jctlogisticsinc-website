[build]
  publish = "."

# Redirect apex to www
[[redirects]]
  from = "https://jctlogisticsinc.com/*"
  to = "https://www.jctlogisticsinc.com/:splat"
  status = 301
  force = true

# Old Wix page paths -> homepage sections
[[redirects]]
  from = "/services"
  to = "/#services"
  status = 301
[[redirects]]
  from = "/about"
  to = "/#why"
  status = 301
[[redirects]]
  from = "/contact"
  to = "/#quote"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
